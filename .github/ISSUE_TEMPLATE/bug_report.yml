name: Bug report
description: Something in KeyPulse does not work the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: if this is about your counts or a snapshot, feel free to
        paste the relevant JSON — it holds nothing but per-key counts — but it
        is your data, so read it first and decide for yourself.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: KeyPulse version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: How are you running it?
      options:
        - The released KeyPulse.exe
        - From source (python main.py)
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, the snapshot JSON, whatever helps.
